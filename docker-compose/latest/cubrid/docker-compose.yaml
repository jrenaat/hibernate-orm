services:
  cubrid:
    image: ${CUBRID_IMAGE:-docker.io/cubrid/cubrid:11.4@sha256:6a6f2abf9eb63a492bb715d9219b0eab190f90996ebf737e99f1ef0ea227f7c7}
    container_name: cubrid
    environment:
      CUBRID_DB: hibernate_orm
      CUBRID_USER: hibernate_orm_test
      CUBRID_PASSWORD: hibernate_orm_test
    ports:
      - "33000:33000"
    healthcheck:
      test: ["CMD-SHELL", "csql -u hibernate_orm_test -p hibernate_orm_test hibernate_orm -c 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
